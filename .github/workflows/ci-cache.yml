name: CI Cache Policy

on:
  # Basic check (sub-minute, no compile): runs after a squash merge, never on
  # the pull request itself (2026-11-06 trigger policy).
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  cache-policy:
    uses: celestia-island/celestia-devtools/.github/workflows/ci-cache.yml@bcf5ed8f3caebe8dbf0a528ab9deecb6d42cf211
    with:
      devtools-ref: bcf5ed8f3caebe8dbf0a528ab9deecb6d42cf211
